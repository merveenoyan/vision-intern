[project]
name = "vision-agent"
version = "0.1.0"
description = "A toolkit for VLM-driven detection pipelines: label datasets, judge labels with a VLM-as-judge, and train detection models — designed to be driven by an orchestrating agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Light core: the label / judge / merge path. No torch — so a CPU-only merge or
# a remote-router labelling job installs in seconds. Heavy training deps live in
# the optional `train` extra below (see tools/__init__.py + workflows/__init__.py,
# which lazily import torch only when a training symbol is touched).
dependencies = [
    "pillow",
    "numpy",
    "requests",
    "tqdm",
    "datasets",
    "openai",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Everything RF-DETR training and local-GPU inference needs.
train = [
    "torch>=2.5.0",
    "torchvision",
    "transformers>=5.10.0",
    "timm",
    "torchmetrics",
    "albumentations",
    "accelerate",
    "pycocotools",
    "scipy",
    "einops",
    "trackio",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
all = ["vision-agent[train,dev]"]

[tool.uv]
# Flat layout (tools/, workflows/, jobs/ at the repo root) — not a built package,
# so uv only manages the environment and does not try to build a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so `from tools...` / `from workflows...` resolve under
# the flat layout, exactly as they do when running `python -m workflows.<x>`.
pythonpath = ["."]
markers = [
    "integration: hits the network / HF Hub / HF Jobs (opt-in, needs HF_TOKEN)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["viz_output", "viz_judged", "viz_test_predictions", "checkpoints"]
